version: "3.9"

services:

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: saniguard-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./infrastructure/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saniguard-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:

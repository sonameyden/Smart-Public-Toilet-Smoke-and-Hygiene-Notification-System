# Mosquitto MQTT Broker Configuration — Saniguard

listener 1883
protocol mqtt

# Allow anonymous connections for local dev
# Set to false and configure passwd for production
allow_anonymous true

# Uncomment and set for authenticated access:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# Persistence — survive broker restarts
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all

# Keep-alive and QoS 1 support
max_keepalive 120
